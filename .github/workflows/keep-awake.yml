# Free Supabase projects pause after 7 days with no activity.
# This pings the database every 3 days so the app stays up between fight cards.
name: Keep database awake
on:
  schedule:
    - cron: "17 15 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(node -e "global.window={};require('./docs/config.js');console.log(window.FP_CONFIG.supabaseUrl)")
          KEY=$(node -e "global.window={};require('./docs/config.js');console.log(window.FP_CONFIG.supabaseAnonKey)")
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
